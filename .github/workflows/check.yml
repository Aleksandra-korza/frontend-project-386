# Проверки проекта на каждый push. Команды берутся из mise.toml
# (те же, что локально и в Git-хуках hk); здесь они не дублируются.
name: check

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Удаление ветки тоже порождает событие push — проверять в этом случае нечего.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история и ветки origin/* нужны для диапазона commitlint.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          # Версия mise как локально; Node.js и pnpm берутся из mise.toml.
          version: 2026.11.9

      # Только зависимости: Git-хуки (hk) в CI не нужны.
      - name: Install dependencies
        run: mise run install-deps

      - name: Check
        run: mise run check

      - name: Build
        run: mise run build

      # Только коммиты текущего push: старая история (например, «Add README.md»)
      # не соответствует Conventional Commits и не проверяется.
      - name: Lint commit messages
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ZERO_SHA=0000000000000000000000000000000000000000
          fail() { echo "::error title=commitlint::$1"; exit 1; }

          git cat-file -e "${AFTER}^{commit}" 2>/dev/null \
            || fail "Коммит $AFTER отсутствует в checkout."

          if [ "$CREATED" != "true" ] && [ "$BEFORE" != "$ZERO_SHA" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FROM="$BEFORE"
            REASON="предыдущая вершина ветки (github.event.before)"
          else
            # Новая ветка (before — нулевой SHA) или старая вершина недоступна
            # после force push: сравниваем с default branch.
            [ -n "$DEFAULT_BRANCH" ] \
              || fail "Не удалось определить default branch репозитория."
            [ "$REF_NAME" != "$DEFAULT_BRANCH" ] \
              || fail "Push в $DEFAULT_BRANCH без доступной предыдущей вершины: базу для диапазона определить нельзя."
            BASE="refs/remotes/origin/$DEFAULT_BRANCH"
            git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null \
              || fail "Ветка origin/$DEFAULT_BRANCH отсутствует в checkout."
            FROM=$(git merge-base "$BASE" "$AFTER") \
              || fail "Нет общего предка $AFTER и origin/$DEFAULT_BRANCH."
            REASON="merge-base с origin/$DEFAULT_BRANCH"
          fi

          COUNT=$(git rev-list --count "$FROM..$AFTER")
          echo "Диапазон: $FROM..$AFTER ($REASON), новых коммитов: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice title=commitlint::В этом push нет новых коммитов относительно базы — проверять нечего."
            exit 0
          fi
          git log --format='  %h %s' "$FROM..$AFTER"
          pnpm exec commitlint --from "$FROM" --to "$AFTER" --verbose
